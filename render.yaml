# Phase 6 (DEPLOYED 15 Nov 2026): Render Free web service for Viral Clip Studio.
# Live: https://viral-clip-studio-iy6g.onrender.com — service srv-dbsio0ui0phs73d8v610, Blueprint-managed, branch main.
# Deploy: push this repo to GitHub, connect it in Render, free plan, no card.
# Env vars to set in the Render dashboard (never commit real keys):
#   GEMINI_API_KEY=<free key, optional>  WHISPER_LANGUAGE=en  WHISPER_MODEL=base
# NOTE: Render Free = 512 MB RAM, sleeps after 15 min idle, ~1 min cold start.
# Transcription now uses faster-whisper (CTranslate2, int8, NO torch) —
# safe on 512 MB. First transcribe downloads the base model (~150 MB)
# from HuggingFace, then it is cached. Heavy rendering is for local
# laptop use.
services:
  - type: web
    name: viral-clip-studio
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: WHISPER_LANGUAGE
        value: en
      - key: WHISPER_MODEL
        value: base
